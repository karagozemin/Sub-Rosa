name: Web checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies and build workspace packages
        run: pnpm install --frozen-lockfile
      - name: Type check the web app
        run: pnpm web:typecheck
      - name: Run web tests
        run: pnpm web:test
      - name: Build production assets
        run: pnpm web:build
